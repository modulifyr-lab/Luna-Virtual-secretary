[package]
name = "luna"
version = "0.1.0"
description = "Luna - Windows Virtual Secretary"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = "1.5"

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "shell-execute"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.29", features = ["bundled"] }
global-hotkey = "0.2"
cpal = "0.15"
rodio = "0.19"
rss = "2.0"
whisper-rs = "0.10"
ort = "2.0.0-rc.9"

[features]
# default custom-protocol is required for production builds or when `isCustomProtocol` is enabled
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
